name: Android build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually rerunning the validation workflow"
        required: false
        default: "Manual verification after workflow repair"

jobs:
  production-foundation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Unreal project descriptor
        run: |
          python3 -m json.tool Unreal/ForestSlice.uproject >/dev/null
          test -f Unreal/Source/ForestSlice/ForestSlice.Build.cs
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceGroundPlanningComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceGroundPlanningComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCombatComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWeaponComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWeaponComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceSurvivalComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceSurvivalComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldClock.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldClock.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceBed.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceBed.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceMobileHUD.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceAccountSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceAccountSubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceInteractionComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceInteractionComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceQuickSlotComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceQuickSlotComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceHealthComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceHealthComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceProgressionComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceProgressionComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCreatureComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCreatureComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceServerDirectorySubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacterProfileComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          grep -q 'SetMeasuredPing' Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          grep -q 'SetProfile' Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          grep -q 'SetCloudRevision' Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/ServerDirectory.kt
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/CharacterCreationModel.kt
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          test -f app/src/main/res/drawable/aethelgard_profile_gold.xml
          test -f assets/asset_budget.json
          test -f tools/validate_asset_budget.py
          test -f tools/test_graphics_tier_contract.py
          test -f tools/check_16kb_alignment.sh
          test -f tools/publish_internal_test.py
          python3 -m py_compile tools/test_resource_center.py tools/test_graphics_tier_contract.py tools/publish_internal_test.py
          bash -n tools/check_16kb_alignment.sh
          grep -q 'installedAndroidOAuthIdentity' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'ndkVersion = "28.0.12433566"' app/build.gradle.kts
          grep -q 'target_link_options' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/mobs/mob_catalog.h
          test -f assetpack_core/build.gradle.kts
          test -f assetpack_forest/build.gradle.kts
          test -f assetpack_voice/build.gradle.kts
          test -f assetpack_graphics_base/build.gradle.kts
          test -f assetpack_shaders_vulkan/build.gradle.kts
          test -f assetpack_shaders_gles/build.gradle.kts
          test -f assetpack_pipeline_cache/build.gradle.kts
          test -f assetpack_world_streaming/build.gradle.kts
          test -f assetpack_foliage_lods/build.gradle.kts
          test -f assetpack_terrain_lod/build.gradle.kts
          test -f assetpack_animation_sets/build.gradle.kts
          python3 tools/validate_asset_budget.py
          python3 tools/test_resource_center.py --repo . --unreal-project Unreal/ForestSlice.uproject
          python3 tools/test_graphics_tier_contract.py
          grep -q 'ACCOUNT LINK' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'SIGN IN WITH GOOGLE' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'GetSignInWithGoogleOption' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'restorePersistedSession' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'clearPersistedSession' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'showCharacterSetup' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          ! grep -q 'PREPARE CHARACTER' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          ! grep -q 'VIEW ART REFERENCES' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'Opening Aethelgard online as a guest' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'requestGuestSignIn' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'requestProductionContent' app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          grep -q 'resourceTier.storageLabel' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'ContentDownloadPlan.totalMiBFor(resourceTier)' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'full3dTargetMiB' app/src/main/assets/asset_manifest.json
          grep -q '1.52f' app/src/main/cpp/controller/third_person_controller.cpp
          ! grep -q 'DEV GUEST' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'bCanMount' Unreal/Source/ForestSlice/Public/ForestSliceCreatureComponent.h
          grep -q 'AddBondProgress' Unreal/Source/ForestSlice/Private/ForestSliceCreatureComponent.cpp
          grep -q 'SweepMultiByChannel' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'FindComponentByClass<UForestSliceHealthComponent>' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'InteractionComponent' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          grep -q 'QuickSlotComponent' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          ! grep -q 'float Stamina' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'EngineAssociation.*5.6' Unreal/ForestSlice.uproject
          grep -q 'bSupportsVulkan=True' Unreal/Config/DefaultEngine.ini
          grep -q 'RequestHeavyAttack' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'GenerateAroundLocation' Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          grep -q 'RestoreFromSleep' Unreal/Source/ForestSlice/Private/ForestSliceSurvivalComponent.cpp
          grep -q 'RequestSleep' Unreal/Source/ForestSlice/Private/ForestSliceWorldClock.cpp
          grep -q 'SetGyroSensorSupport' Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          grep -q 'StartGooglePlaySignIn' Unreal/Source/ForestSlice/Public/ForestSliceAccountSubsystem.h
          grep -q 'toggleViewMode' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'currentPlayerName' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'setPlayerName' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          ! grep -q 'text = "AETHELGRAD  •  DAY 1  •  DAY"' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'teleportToTower' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'drawTeleportationTower' app/src/main/cpp/forest_game.cpp
          grep -q 'draw3DHighQualityDetails' app/src/main/cpp/forest_game.cpp
          grep -q 'uQuality' app/src/main/cpp/forest_game.cpp
          grep -q 'collisionIterations' app/src/main/cpp/physics/physics.cpp || grep -q 'iteration < 3' app/src/main/cpp/physics/physics.cpp
          grep -q 'airControl = 0.48f' app/src/main/cpp/physics/physics.h
          grep -q 'highFidelityFeatures' app/src/main/assets/asset_manifest.json
          test -f docs/HIGH_END_MOBILE_FIDELITY.md
          grep -q 'MaxCameraOrbitDegrees' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'MinCameraPitchDegrees' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'bDoCollisionTest' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          grep -q 'DigAtLocation' Unreal/Source/ForestSlice/Public/ForestSliceGroundPlanningComponent.h
          grep -q 'UndergroundContentActor' Unreal/Source/ForestSlice/Public/ForestSliceGroundPlanningComponent.h
          grep -q 'TriggerVirtualPlanGround' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'TriggerVirtualCreateFarmContour' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'TriggerVirtualPlantSeed' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'AwardGrindingXP' Unreal/Source/ForestSlice/Public/ForestSliceProgressionComponent.h
          grep -q '100000' app/src/main/cpp/rpg/progression.cpp
          grep -q 'kPlayerMaxHealthHp = 100' app/src/main/cpp/forest_game.cpp
          grep -q 'ProgressionComponent' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          grep -q 'leftZoneFraction' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'drawPrototypeTerrainChunks' app/src/main/cpp/forest_game.cpp
          grep -q 'interactEmberling' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'Emberling Companion Milestone' docs/EMBERLING_COMPANION_MILESTONE.md
          grep -q 'GroundInstances' Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          grep -q 'DetailInstances' Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          grep -q 'DetailsPerChunk = 96' Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          grep -q 'GroundAcceleration' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'CameraRotationLagSpeed' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'GetChunkPresentationAlpha' Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          grep -q 'InitializeMapLayout' Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          grep -q 'GetBiomeAtWorldLocation' Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          grep -q 'UForestSliceInventoryComponent' Unreal/Source/ForestSlice/Public/ForestSliceInventoryComponent.h
          grep -q 'HasCapacityFor' Unreal/Source/ForestSlice/Private/ForestSliceInventoryComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceResourceNodeComponent.h
          grep -q 'TryCollect' Unreal/Source/ForestSlice/Private/ForestSliceResourceNodeComponent.cpp
          grep -q 'ServerTriggerVirtualCollect' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'GatherPressed' Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          grep -q 'checkProductionPreflight' app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          grep -q 'StatFs' app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          grep -q 'minimumFreeSpaceMiB' app/src/main/java/com/darvirgoyt/aethelgrad/ContentDownloadPlan.kt
          grep -q 'WAITING_FOR_WIFI' app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          grep -q 'REQUIRES_USER_CONFIRMATION' app/src/main/java/com/darvirgoyt/aethelgrad/AssetPackCatalog.kt
          grep -q 'requestProductionContent' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'reconnectCoOpRoom' app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          grep -q 'RECONNECTING' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'reconnect' server/src/server.mjs
          grep -q 'room_full' server/src/server.mjs
          grep -q 'max_players INTEGER NOT NULL DEFAULT 4' server/sql/003_coop_rendezvous.sql
          grep -q 'MaxCoopMembers = 4' Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          grep -q 'AddOrReconnectMember' Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          grep -q 'CanStartCoopSession' Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          test -f docs/MULTIPLAYER_WORKFLOW.md

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and run physics tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/physics_test.cpp app/src/main/cpp/physics/physics.cpp \
            -o physics_test
          ./physics_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/mob_catalog_test.cpp \
            -o mob_catalog_test
          ./mob_catalog_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/combat_controller_test.cpp \
            app/src/main/cpp/physics/physics.cpp \
            app/src/main/cpp/controller/third_person_controller.cpp \
            app/src/main/cpp/combat/combat_system.cpp \
            -o combat_controller_test
          ./combat_controller_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/progression_test.cpp \
            app/src/main/cpp/rpg/progression.cpp \
            -o progression_test
          ./progression_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/cloud_state_test.cpp \
            -o cloud_state_test
          ./cloud_state_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/emberling_companion_test.cpp \
            -o emberling_companion_test
          ./emberling_companion_test

  online-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate online service configuration and security tests
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          node --test test/coop_room_simulation.test.mjs
          test -f sql/002_hardened_sessions.sql
          grep -q 'GOOGLE_GAME_SERVER_CLIENT_SECRET' .env.example
          grep -q 'GAME_ACCESS_TOKEN_TTL_SECONDS' .env.example
          grep -q 'replayed_server_auth_code' src/server.mjs
          grep -q 'replayed_refresh_session' src/server.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.12433566"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore protected release signing key
        env:
          AETHELGARD_RELEASE_KEYSTORE_BASE64: ${{ secrets.AETHELGARD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AETHELGARD_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$AETHELGARD_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethelgard-release.jks"
          fi

      - name: Validate asset budget and assemble release artifacts
        env:
          AETHELGARD_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aethelgard-release.jks
          AETHELGARD_RELEASE_STORE_PASSWORD: ${{ secrets.AETHELGARD_RELEASE_STORE_PASSWORD }}
          AETHELGARD_RELEASE_KEY_ALIAS: ${{ secrets.AETHELGARD_RELEASE_KEY_ALIAS }}
          AETHELGARD_RELEASE_KEY_PASSWORD: ${{ secrets.AETHELGARD_RELEASE_KEY_PASSWORD }}
        run: |
          python3 tools/validate_asset_budget.py
          gradle bundleRelease assembleRelease assemblePrototype --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > app/build/outputs/signing-certificate.txt

      - name: Verify 16 KB native alignment
        env:
          ANDROID_NDK_VERSION: "28.0.12433566"
        run: tools/check_16kb_alignment.sh app/build/outputs/apk/release/app-release.apk

      - name: Build and verify standalone expansion OBB
        run: |
          rm -rf build/obb-staging build/expansion-obb
          mkdir -p build/obb-staging
          cp app/src/main/assets/asset_manifest.json build/obb-staging/asset_manifest.json
          cp -R app/src/main/assets/asset_packs build/obb-staging/asset_packs
          python3 tools/build_expansion_obb.py \
            --input-dir build/obb-staging \
            --output-dir build/expansion-obb \
            --package-name com.darvirgoyt.aethelgrad \
            --version-code 3 \
            --content-version "prototype-${GITHUB_SHA}"
          python3 tools/verify_expansion_obb.py build/expansion-obb/main.3.com.darvirgoyt.aethelgrad.obb

      - name: Upload standalone expansion OBB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-expansion-obb
          path: build/expansion-obb/main.3.com.darvirgoyt.aethelgrad.obb
          if-no-files-found: error

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forest-slice-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload direct AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: forest-slice-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload offline prototype APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-prototype-apk
          path: app/build/outputs/apk/prototype/app-prototype.apk

      - name: Upload signing certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-android-signing-certificate
          path: app/build/outputs/signing-certificate.txt
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish v0.2.2 Direct Android release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download direct APK artifact
        uses: actions/download-artifact@v4
        with:
          name: forest-slice-release-apk
          path: release

      - name: Download direct AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: forest-slice-release-aab
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: AETHELGRAD v0.2.2 — Direct Android Downloads
          body: |
            AETHELGRAD Android build with direct APK and Android App Bundle downloads.
            Download `app-release.apk` for direct installation on a compatible Android device. Use `app-release.aab` for Google Play or bundle testing.
            The APK is signed with the repository's debug signing configuration for test distribution only. A protected production keystore is required for Google Play publishing.
            The Actions build ZIP is only a CI container; use these release assets instead of opening the ZIP.
          files: |
            release/app-release.apk
            release/app-release.aab
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  actions: read
  checks: read
