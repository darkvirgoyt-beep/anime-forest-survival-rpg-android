name: Android build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  production-foundation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Unreal project descriptor
        run: |
          python3 -m json.tool Unreal/ForestSlice.uproject >/dev/null
          test -f Unreal/Source/ForestSlice/ForestSlice.Build.cs
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCombatComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWeaponComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWeaponComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceSurvivalComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceSurvivalComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldClock.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldClock.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceBed.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceBed.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceMobileHUD.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceAccountSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceAccountSubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceInteractionComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceInteractionComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceQuickSlotComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceQuickSlotComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceHealthComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceHealthComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCreatureComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCreatureComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceServerDirectorySubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacterProfileComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          grep -q 'SetMeasuredPing' Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          grep -q 'SetProfile' Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          grep -q 'SetCloudRevision' Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/AccountSessionManager.kt
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/ServerDirectory.kt
          test -f app/src/main/java/com/darvirgoyt/aethelgrad/CharacterCreationModel.kt
          grep -q 'GOOGLE PLAY SIGN-IN' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'ApplicationInfo.FLAG_DEBUGGABLE' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'ONLINE ONLY' app/src/main/java/com/darvirgoyt/aethelgrad/MainActivity.kt
          grep -q 'bCanMount' Unreal/Source/ForestSlice/Public/ForestSliceCreatureComponent.h
          grep -q 'AddBondProgress' Unreal/Source/ForestSlice/Private/ForestSliceCreatureComponent.cpp
          grep -q 'SweepMultiByChannel' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'FindComponentByClass<UForestSliceHealthComponent>' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'InteractionComponent' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          grep -q 'QuickSlotComponent' Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          ! grep -q 'float Stamina' Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          grep -q 'EngineAssociation.*5.6' Unreal/ForestSlice.uproject
          grep -q 'bSupportsVulkan=True' Unreal/Config/DefaultEngine.ini
          grep -q 'RequestHeavyAttack' Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          grep -q 'GenerateAroundLocation' Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          grep -q 'RestoreFromSleep' Unreal/Source/ForestSlice/Private/ForestSliceSurvivalComponent.cpp
          grep -q 'RequestSleep' Unreal/Source/ForestSlice/Private/ForestSliceWorldClock.cpp
          grep -q 'SetGyroSensorSupport' Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          grep -q 'StartGooglePlaySignIn' Unreal/Source/ForestSlice/Public/ForestSliceAccountSubsystem.h

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run physics tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/physics_test.cpp app/src/main/cpp/physics/physics.cpp \
            -o physics_test
          ./physics_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/combat_controller_test.cpp \
            app/src/main/cpp/physics/physics.cpp \
            app/src/main/cpp/controller/third_person_controller.cpp \
            app/src/main/cpp/combat/combat_system.cpp \
            -o combat_controller_test
          ./combat_controller_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/progression_test.cpp \
            app/src/main/cpp/rpg/progression.cpp \
            -o progression_test
          ./progression_test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble release-style APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forest-slice-release-apk
          path: app/build/outputs/apk/release/app-release.apk


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Create v0.2.1 APK release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: forest-slice-release-apk
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: Forest Slice v0.2.1 — Cel-Shaded Hero
          body: |
            Android release build for Aethelgard: Wild Horizons – Crafting.

            This release includes the original cel-shaded playable hero with ink-like contours, hard shadow planes, expressive anime-fantasy hair, outfit accents, and a short sword.

            The APK is signed with the repository's debug signing configuration for test distribution only. A protected production keystore is required for Google Play publishing.
          files: release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  actions: read
  checks: read
