name: Android build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually rerunning the validation workflow"
        required: false
        default: "Manual verification after workflow repair"

jobs:
  production-foundation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Unreal project descriptor
        run: |
          python3 -m json.tool Unreal/ForestSlice.uproject >/dev/null
          test -f Unreal/Source/ForestSlice/ForestSlice.Build.cs
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacter.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacter.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceGroundPlanningComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceGroundPlanningComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCombatComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCombatComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWeaponComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWeaponComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceProceduralForest.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceProceduralForest.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceSurvivalComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceSurvivalComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldClock.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldClock.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceBed.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceBed.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceMobileHUD.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceMobileHUD.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceAccountSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceAccountSubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceInteractionComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceInteractionComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceQuickSlotComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceQuickSlotComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceHealthComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceHealthComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceProgressionComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceProgressionComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCreatureComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCreatureComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceServerDirectorySubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceCharacterProfileComponent.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          test -f Unreal/Source/ForestSlice/Public/ForestSliceWorldSessionSubsystem.h
          test -f Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          grep -q 'SetMeasuredPing' Unreal/Source/ForestSlice/Private/ForestSliceServerDirectorySubsystem.cpp
          grep -q 'SetProfile' Unreal/Source/ForestSlice/Private/ForestSliceCharacterProfileComponent.cpp
          grep -q 'SetCloudRevision' Unreal/Source/ForestSlice/Private/ForestSliceWorldSessionSubsystem.cpp
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/AccountSessionManager.kt
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/ServerDirectory.kt
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/CharacterCreationModel.kt
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/AssetPackCatalog.kt
          test -f app/src/main/res/drawable/aethelgard_profile_gold.xml
          test -f assets/asset_budget.json
          test -f tools/validate_asset_budget.py
          test -f tools/test_graphics_tier_contract.py
          test -f tools/test_startup_warmup.py
          test -f tools/stage_cooked_unreal_assets.py
          test -f tools/unreal_pack_mapping.json
          test -f tools/test_production_foundation_contract.py
          test -f tools/test_online_only_contract.py
          test -f tools/test_persistent_multiplayer_contract.py
          test -f tools/test_progressive_content_contract.py
          test -f tools/check_16kb_alignment.sh
          test -f tools/publish_internal_test.py
          python3 -m py_compile tools/test_resource_center.py tools/test_graphics_tier_contract.py tools/test_production_foundation_contract.py tools/test_online_only_contract.py tools/test_persistent_multiplayer_contract.py tools/test_progressive_content_contract.py tools/publish_internal_test.py
          bash -n tools/check_16kb_alignment.sh
          grep -q 'Log.w("AethelgardAuth"' app/src/main/java/com/darkvirgoyt/aethelgrand/AccountSessionManager.kt
          grep -q 'describeGoogleCredentialFailure' app/src/main/java/com/darkvirgoyt/aethelgrand/AccountSessionManager.kt
          grep -q 'ndkVersion = "28.0.12433566"' app/build.gradle.kts
          grep -q 'namespace = "com.darkvirgoyt.aethelgrand"' app/build.gradle.kts
          grep -q 'applicationId = "com.darkvirgoyt.aethelgrand"' app/build.gradle.kts
          ! grep -R -q 'com.darvirgoyt.aethelgrad' app/src/main app/build.gradle.kts app/src/main/cpp
          grep -q 'Java_com_darkvirgoyt_aethelgrand_NativeGameBridge_setGraphicsQuality' app/src/main/cpp/forest_game.cpp
          ! grep -q 'Java_com_darvirgoyt_aethelgrad_NativeGameBridge_' app/src/main/cpp/forest_game.cpp
          grep -q 'target_link_options' app/src/main/cpp/CMakeLists.txt
          grep -q 'void draw3DEmberling' app/src/main/cpp/forest_game.cpp
          grep -q 'void draw3DForestWarden' app/src/main/cpp/forest_game.cpp
          grep -q 'draw3DForestWarden(viewProjection)' app/src/main/cpp/forest_game.cpp
          grep -q 'draw3DEmberling(viewProjection)' app/src/main/cpp/forest_game.cpp
          grep -q 'MobType::MoonDeer' app/src/main/cpp/mobs/mob_catalog.h
          grep -q 'MobType::MossbackBoar' app/src/main/cpp/mobs/mob_catalog.h
          grep -q 'MobType::RiverOtter' app/src/main/cpp/mobs/mob_catalog.h
          grep -q 'MobType::CanopyFox' app/src/main/cpp/mobs/mob_catalog.h
          grep -q 'mobProfile.tameable' app/src/main/cpp/forest_game.cpp
          grep -q 'TAME ANIMAL' app/src/main/java/com/darkvirgoyt/aethelgrand/MainActivity.kt
          test -f docs/MOB_AND_TAMING_IMPLEMENTATION.md
          grep -q 'void draw3DPlayer' app/src/main/cpp/forest_game.cpp
          grep -q 'LocomotionState::Sprint' app/src/main/cpp/forest_game.cpp
          grep -q 'gAttackPulse > 0' app/src/main/cpp/forest_game.cpp
          test -f docs/3D_ANIMATION_IMPLEMENTATION.md
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/StandaloneExpansionFile.kt
          test -f app/src/main/java/com/darkvirgoyt/aethelgrand/PrivateContentDownloader.kt
          test -f tools/build_private_content_manifest.py
          grep -q '/v1/content/high/manifest' server/src/server.mjs
          grep -q '/v1/content/high/archive' server/src/server.mjs
          grep -q 'automaticExpansion' app/src/main/assets/asset_manifest.json
          grep -q 'deliveryType.set("fast-follow")' assetpack_forest/build.gradle.kts
          grep -q 'showAssetPatchOverlay' app/src/main/java/com/darkvirgoyt/aethelgrand/MainActivity.kt
          grep -q 'showDownloadConfirmation' app/src/main/java/com/darkvirgoyt/aethelgrand/AssetPackCatalog.kt
          test -f app/src/main/cpp/mobs/mob_catalog.h
          test -f assetpack_core/build.gradle.kts
          test -f assetpack_forest/build.gradle.kts
          test -f assetpack_voice/build.gradle.kts
          test -f assetpack_graphics_base/build.gradle.kts
          test -f assetpack_shaders_vulkan/build.gradle.kts
          test -f assetpack_shaders_gles/build.gradle.kts
          test -f assetpack_pipeline_cache/build.gradle.kts
          test -f assetpack_world_streaming/build.gradle.kts
          test -f assetpack_foliage_lods/build.gradle.kts
          test -f assetpack_terrain_lod/build.gradle.kts
          test -f assetpack_animation_sets/build.gradle.kts
          python3 tools/validate_asset_budget.py
          python3 tools/validate_runtime_content_package.py
          python3 tools/test_resource_center.py --repo . --unreal-project Unreal/ForestSlice.uproject
          python3 tools/test_graphics_tier_contract.py
          python3 tools/test_startup_warmup.py --repo .
          python3 -m py_compile tools/stage_cooked_unreal_assets.py tools/test_startup_warmup.py tools/build_private_content_manifest.py
          python3 -m json.tool tools/unreal_pack_mapping.json >/dev/null
          python3 tools/test_production_foundation_contract.py
          python3 tools/test_online_only_contract.py
          python3 tools/test_persistent_multiplayer_contract.py
          python3 tools/test_progressive_content_contract.py

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and run physics tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/physics_test.cpp app/src/main/cpp/physics/physics.cpp \
            -o physics_test
          ./physics_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/mob_catalog_test.cpp \
            -o mob_catalog_test
          ./mob_catalog_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/combat_controller_test.cpp \
            app/src/main/cpp/physics/physics.cpp \
            app/src/main/cpp/controller/third_person_controller.cpp \
            app/src/main/cpp/combat/combat_system.cpp \
            -o combat_controller_test
          ./combat_controller_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/progression_test.cpp \
            app/src/main/cpp/rpg/progression.cpp \
            -o progression_test
          ./progression_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/cloud_state_test.cpp \
            -o cloud_state_test
          ./cloud_state_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/exploration_progression_test.cpp \
            -o exploration_progression_test
          ./exploration_progression_test
          g++ -O2 -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/cloud_state_benchmark.cpp \
            -o cloud_state_benchmark
          if command -v taskset >/dev/null 2>&1; then
            taskset -c 0 ./cloud_state_benchmark cloud-state-benchmark.json | tee cloud-state-benchmark.csv
          else
            ./cloud_state_benchmark cloud-state-benchmark.json | tee cloud-state-benchmark.csv
          fi
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/emberling_companion_test.cpp \
            -o emberling_companion_test
          ./emberling_companion_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/rpg_systems_test.cpp \
            -o rpg_systems_test
          ./rpg_systems_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp \
            tests/animation_state_test.cpp \
            -o animation_state_test
          ./animation_state_test

      - name: Upload cloud save benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: cloud-save-benchmark
          path: |
            cloud-state-benchmark.json
            cloud-state-benchmark.csv

  online-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate online service configuration and security tests
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          node --test test/coop_room_simulation.test.mjs
          test -f sql/002_hardened_sessions.sql
          grep -q 'GOOGLE_GAME_SERVER_CLIENT_SECRET' .env.example
          grep -q 'GAME_ACCESS_TOKEN_TTL_SECONDS' .env.example
          grep -q 'replayed_server_auth_code' src/server.mjs
          grep -q 'replayed_refresh_session' src/server.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.12433566"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore protected release signing key
        env:
          AETHELGARD_RELEASE_KEYSTORE_BASE64: ${{ secrets.AETHELGARD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AETHELGARD_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$AETHELGARD_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethelgard-release.jks"
          fi

      - name: Validate asset budget and assemble release artifacts
        env:
          AETHELGARD_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aethelgard-release.jks
          AETHELGARD_RELEASE_STORE_PASSWORD: ${{ secrets.AETHELGARD_RELEASE_STORE_PASSWORD }}
          AETHELGARD_RELEASE_KEY_ALIAS: ${{ secrets.AETHELGARD_RELEASE_KEY_ALIAS }}
          AETHELGARD_RELEASE_KEY_PASSWORD: ${{ secrets.AETHELGARD_RELEASE_KEY_PASSWORD }}
        run: |
          python3 tools/validate_asset_budget.py
          gradle bundleRelease assembleRelease --stacktrace
          APK_PACKAGE="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$APK_PACKAGE" = "com.darkvirgoyt.aethelgrand"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > app/build/outputs/signing-certificate.txt

      - name: Verify release APK identity and report payload sizes
        run: |
          AAPT_BIN="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APK_PACKAGE="$($AAPT_BIN dump badging "$APK_PATH" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$APK_PACKAGE" = "com.darkvirgoyt.aethelgrand"
          test -s "$APK_PATH"
          test -s "app/build/outputs/bundle/release/app-release.aab"
          APK_BYTES=$(stat -c%s "$APK_PATH")
          AAB_BYTES=$(stat -c%s "app/build/outputs/bundle/release/app-release.aab")
          printf 'package=%s\\napk_bytes=%s\\naab_bytes=%s\\n' "$APK_PACKAGE" "$APK_BYTES" "$AAB_BYTES" > app/build/outputs/release-package-report.txt
          cat app/build/outputs/release-package-report.txt

      - name: Build Play Asset Delivery local-testing APK set
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar \
            --output bundletool.jar
          mkdir -p build/local-testing
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=build/local-testing/aethelgard-local-testing.apks \
            --local-testing \
            --overwrite
          test -s build/local-testing/aethelgard-local-testing.apks

      - name: Upload Play Asset Delivery local-testing APK set
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-pad-local-testing-apks
          path: build/local-testing/aethelgard-local-testing.apks
          if-no-files-found: error

      - name: Verify 16 KB native alignment
        env:
          ANDROID_NDK_VERSION: "28.0.12433566"
        run: tools/check_16kb_alignment.sh app/build/outputs/apk/release/app-release.apk

      - name: Build and verify standalone expansion OBB
        id: standalone-obb
        run: |
          rm -rf build/obb-staging build/expansion-obb
          mkdir -p build/obb-staging
          cp app/src/main/assets/asset_manifest.json build/obb-staging/asset_manifest.json
          COOK_ROOT="${AETHELGARD_COOKED_ROOT:-Build/Android/Archive/Saved/StagedBuilds/Android/ForestSlice/Content/Paks}"
          COOKED_PAK="$(find "$COOK_ROOT" -type f -name 'pakchunk*.pak' -print -quit 2>/dev/null || true)"
          if [ -n "$COOKED_PAK" ]; then
            echo "Staging real cooked Unreal runtime content from $COOK_ROOT"
            python3 tools/stage_cooked_unreal_assets.py \
              --cook-root "$COOK_ROOT" \
              --output-dir build/obb-staging \
              --mapping-file tools/unreal_pack_mapping.json
          else
            echo "No trusted cooked Unreal output found; standalone OBB artifact is skipped."
            echo "Provide AETHELGARD_COOKED_ROOT with the signed shipping Unreal cook to enable automatic OBB generation."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          AAPT_BIN="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APK_PACKAGE="$($AAPT_BIN dump badging "$APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          APK_VERSION_CODE="$($AAPT_BIN dump badging "$APK_PATH" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test "$APK_PACKAGE" = "com.darkvirgoyt.aethelgrand"
          test "$APK_VERSION_CODE" -gt 0
          python3 tools/build_expansion_obb.py \
            --input-dir build/obb-staging \
            --output-dir build/expansion-obb \
            --package-name "$APK_PACKAGE" \
            --version-code "$APK_VERSION_CODE" \
            --content-version "production-${GITHUB_SHA}"
          OBB_PATH="build/expansion-obb/main.${APK_VERSION_CODE}.${APK_PACKAGE}.obb"
          test -f "$OBB_PATH"
          python3 tools/verify_expansion_obb.py "$OBB_PATH" \
            --expected-package "$APK_PACKAGE" \
            --expected-version "$APK_VERSION_CODE"

      - name: Upload standalone expansion OBB artifact
        if: steps.standalone-obb.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-expansion-obb
          path: build/expansion-obb/main.*.com.darkvirgoyt.aethelgrand.obb
          if-no-files-found: error

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forest-slice-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload direct AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: forest-slice-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release package report
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-release-package-report
          path: app/build/outputs/release-package-report.txt
          if-no-files-found: error
      - name: Upload signing certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-android-signing-certificate
          path: app/build/outputs/signing-certificate.txt
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish v0.2.2 Direct Android release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download direct APK artifact
        uses: actions/download-artifact@v4
        with:
          name: forest-slice-release-apk
          path: release

      - name: Download direct AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: forest-slice-release-aab
          path: release

      - name: Download PAD local-testing APK set
        uses: actions/download-artifact@v4
        with:
          name: aethelgard-pad-local-testing-apks
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: AETHELGRAD v0.2.2 — Direct Android Downloads
          body: |
            AETHELGRAD Android build with direct APK, Android App Bundle, and Play Asset Delivery local-testing downloads.
            Download `app-release.apk` only for base-client UI/native testing; it cannot fetch Play Asset Delivery packs by itself. Use `app-release.aab` for Google Play or bundle testing, or install `aethelgard-local-testing.apks` with bundletool to test asset-pack downloads outside Play.
            The APK is signed with the repository's debug signing configuration for test distribution only. A protected production keystore is required for Google Play publishing.
            The Actions build ZIP is only a CI container; use these release assets instead of opening the ZIP.
          files: |
            release/app-release.apk
            release/app-release.aab
            release/aethelgard-local-testing.apks
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  actions: read
  checks: read
