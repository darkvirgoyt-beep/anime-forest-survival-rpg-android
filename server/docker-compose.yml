services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aethelgard
      POSTGRES_USER: aethelgard
      POSTGRES_PASSWORD: aethelgard_dev
    ports:
      - "5432:5432"
    volumes:
      - aethelgard_pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethelgard -d aethelgard"]
      interval: 5s
      timeout: 3s
      retries: 20

  online-services:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://aethelgard:aethelgard_dev@postgres:5432/aethelgard
      DATABASE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aethelgard_pgdata:
